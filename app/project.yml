# The app that owns the grants, the index and the schedule.
#
# 🛑 Generated into AppleTools.xcodeproj by `make generate`. Never edit the
# .xcodeproj — it is not in git.
#
# 🛑 THE BUNDLE ID IS LOAD-BEARING AND MUST NOT CHANGE. TCC keys a grant to the
# bundle id and the signing identity, so renaming it makes the user grant Full
# Disk Access again by hand. The DISPLAY NAME is free to change; the id is not.
# The product name here is a placeholder — see docs/todo-index-app.md, which
# records why nothing public may be called "Apple ...".
name: AppleTools

options:
  bundleIdPrefix: com.boulderhopkins
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: none

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: ${APP_VERSION}
    CURRENT_PROJECT_VERSION: ${APP_BUILD}
    DEVELOPMENT_TEAM: 25RCAA3JLJ
    PRODUCT_BUNDLE_IDENTIFIER: com.boulderhopkins.apple-tools
    # 🛑 Manual, and a Developer ID identity even for a debug build. An ad-hoc
    # signature keys TCC to the cdhash, so EVERY REBUILD would drop the Full
    # Disk Access grant and the user would re-approve it by hand each time.
    # A stable Developer ID signature survives a rebuild.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Developer ID Application"
    ENABLE_HARDENED_RUNTIME: YES
    # 🛑 REQUIRED TO NOTARIZE, and `xcodebuild build` does not add it. Only
    # `archive` timestamps by default, so a plain build is rejected with
    # "The signature does not include a secure timestamp" — which cost one
    # round trip to Apple to discover.
    OTHER_CODE_SIGN_FLAGS: --timestamp
    # 🛑 NO. Xcode injects `get-task-allow` otherwise, which lets ANY process
    # running as this user attach a debugger to an app that holds Full Disk
    # Access — and notarization rejects the bundle for it as well.
    CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    # ⚠️ The App Sandbox denies every store this app exists to read, and Full
    # Disk Access does not lift it. Off, permanently. See the design doc.
    ENABLE_APP_SANDBOX: NO
    COMBINE_HIDPI_IMAGES: YES
    DEAD_CODE_STRIPPING: YES

targets:
  # 🛑 A SEPARATE, SIGNED Mach-O, and that is its whole reason to exist. The app
  # checks the peer's code signature on the proxy socket, and a Python or shell
  # client's identity is `/usr/bin/python3` or `/bin/bash` — signed by Apple and
  # shared by every script on the machine. A binary signed with THIS developer's
  # identity gives the check something to say.
  ProxyClient:
    type: tool
    platform: macOS
    sources:
      - path: ProxyClient
      # 🛑 SHARED, not copied. The requirement text lives in one file, so the
      # app that checks a peer and the client that must satisfy it can never
      # disagree about what the identifier is.
      - path: Sources/PeerIdentity.swift
    settings:
      base:
        PRODUCT_NAME: apple-proxy
        PRODUCT_BUNDLE_IDENTIFIER: com.boulderhopkins.apple-tools.proxy
        # ⚠️ A plain tool has no Info.plist, so the signing IDENTIFIER comes
        # from here. `PeerIdentity.requirementText` names it exactly.
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES

  AppleTools:
    type: application
    platform: macOS
    sources:
      - path: Sources
      # 🛑 The icon the website already uses, padded to Apple's 824-in-1024
      # grid by `make-icon.sh`. Do not edit the .icns by hand — it is built.
      - path: Icon/AppleTools.icns
      # 🛑 A FOLDER REFERENCE, so `web/` keeps its name inside Resources and
      # `Bundle.url(forResource:subdirectory:)` finds it. Copied as a group
      # instead, the files land loose in Resources and the subdirectory lookup
      # returns nil.
      - path: Resources/web
        type: folder
    entitlements:
      path: AppleTools.entitlements
      properties:
        # The only entitlement a non-sandboxed app needs here: `apple mail
        # compose`, `apple notes delete` and a contact note all send Apple
        # Events. 🛑 Do NOT add disable-library-validation. Spawning
        # /usr/bin/python3 does not need it; only loading a foreign dylib would.
        com.apple.security.automation.apple-events: true
        # ⚠️ TESTING A CLAIM FROM prior-art. These two read as App Sandbox
        # entitlements, and the design doc ruled them out for that reason.
        # `psychquant/che-ical-mcp` reports them as load-bearing for a
        # NON-sandboxed Developer ID binary on macOS 26+, without which the
        # Calendar and Contacts dialogs never present — which is exactly what
        # this app measured. Harmless if the claim turns out to be wrong.
        com.apple.security.personal-information.calendars: true
        com.apple.security.personal-information.addressbook: true
        # ⚠️ TESTING A CLAIM FROM prior-art. These three read as App Sandbox
        # entitlements, and the design doc ruled them out for that reason.
        # `psychquant/che-ical-mcp` reports them as load-bearing for a
        # NON-sandboxed Developer ID binary on macOS 26+, without which the
        # Calendar and Reminders dialogs never present. That matches exactly
        # what this app measured. Harmless if the claim is wrong.
        com.apple.security.personal-information.calendars: true
        com.apple.security.personal-information.addressbook: true
    dependencies:
      - target: ProxyClient
        embed: false
    postBuildScripts:
      # 🛑 A build phase, so Xcode signs the OUTER bundle afterwards. Copying
      # helpers in from the Makefile after the build would leave the outer
      # signature stale, and re-signing it by hand is what `--deep` is for —
      # which is the thing not to do.
      - script: "\"$SRCROOT/sign-helpers.sh\""
        name: Embed and sign the CLIs
    info:
      path: Info.plist
      properties:
        CFBundleName: AppleTools
        CFBundleDisplayName: AppleTools
        # ⚠️ NO EXTENSION. `CFBundleIconFile` names the file without `.icns`,
        # and with one macOS finds nothing and shows the generic tile.
        CFBundleIconFile: AppleTools
        CFBundlePackageType: APPL
        CFBundleShortVersionString: ${APP_VERSION}
        CFBundleVersion: ${APP_BUILD}
        # 🛑 NO DOCK ICON AT REST, and one while a window is open. A background
        # indexer with a permanent Dock tile is noise; a visible window with no
        # tile cannot be switched back to once it is behind something. The app
        # raises its activation policy while the window lives — see
        # `DockPresence` in App.swift.
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: ""
        # 🛑 There is NO usage string for Full Disk Access, and that pane shows
        # no reason text at all. The onboarding copy in the window carries it.
        NSAppleEventsUsageDescription: >-
          AppleTools drives Mail, Notes and Contacts to write the things their
          own frameworks refuse to write.
        NSContactsUsageDescription: >-
          AppleTools reads your contacts so `apple contacts` works and so the
          index can find people by name.
        NSCalendarsFullAccessUsageDescription: >-
          AppleTools reads and writes your calendar so `apple calendar` works
          and so the index covers your events.
        NSRemindersFullAccessUsageDescription: >-
          AppleTools reads and writes your reminders so `apple reminders` works.
        # ⚠️ The LEGACY keys as well as the split ones. macOS 14 split calendar
        # into full and write-only access with new key names, and it is not
        # documented whether the old key is still consulted. Reminders prompts
        # with only the new key; calendar does not. Carrying both costs nothing.
        NSCalendarsUsageDescription: >-
          AppleTools reads and writes your calendar so `apple calendar` works
          and so the index covers your events.
        NSRemindersUsageDescription: >-
          AppleTools reads and writes your reminders so `apple reminders` works.
        NSContactsFullAccessUsageDescription: >-
          AppleTools reads your contacts so `apple contacts` works and so the
          index can find people by name.
